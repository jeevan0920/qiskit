services:
  qiskit-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: qiskit-dev
    
    # Mount your local code
    volumes:
      - .:/workspace
      - /workspace/.git
      - /workspace/__pycache__
      - /workspace/.tox
      - /workspace/target
      - /workspace/.cargo
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Environment variables
    environment:
      - QISKIT_BUILD_PROFILE=release
      - RUST_BACKTRACE=full
      - QISKIT_TEST_CAPTURE_STREAMS=0
      - PYTHONUNBUFFERED=1
    
    # Keep running
    command: /bin/bash
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
